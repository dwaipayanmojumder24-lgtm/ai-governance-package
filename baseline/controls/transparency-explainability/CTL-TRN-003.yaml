id: "ORG-CTL-TRN-003"
title: "Adverse Action Algorithmic Explainability and Feature Attribution"
objective: "Ensure that any AI system informing or executing decisions with adverse material effects on individuals provides interpretable, mathematically sound explanations detailing key decision factors."
domain: "transparency_disclosure"
type: "conditional"

applicability_condition:
  predicate_type: "manifest_property_match"
  manifest_path: "ai_system_profile.declared_characteristics.makes_autonomous_decisions_affecting_humans"
  operator: "is_true"
  target_value: true
  description: "Applies to systems making or recommending decisions impacting individual rights, credit, benefits, or employment."

lifecycle_stages:
  - "evaluation_validation"
  - "integration_ci_cd"
  - "deployment_admission"

enforcement_points:
  - "ci_build_pipeline"
  - "deployment_admission_controller"
  - "manual_audit_gate"

check_type: "hybrid"
mode: "blocking"

evidence_required:
  - artifact_type: "explainability_validation_report"
    description: "Technical evaluation proving that local and global feature attribution methods (e.g. SHAP, Integrated Gradients) produce faithful, human-interpretable factor rankings."
    format: "json"
    retention_period_years: 7

exception_eligibility:
  eligible: false
  statutory_prohibition: true
  minimum_compensating_controls:
    - "No exceptions permitted. Adverse action explanation is a non-waivable statutory requirement under credit and privacy laws."

reference_mappings:
  - framework: "EU AI Act Regulation (EU) 2024/1689"
    clause_or_section: "Article 86"
    citation_title: "Right to explanation of individual decision-making"
    mapping_status: "verified"
    notes: "Provides affected persons the right to obtain clear and meaningful explanations of the role of AI in decision-making."
  - framework: "NIST AI RMF 1.0"
    clause_or_section: "MEASURE 2.8"
    citation_title: "AI systems are evaluated for explainability and interpretability."
    mapping_status: "verified"
    notes: "Requires formal measurement and documentation of algorithmic explainability."
  - framework: "ISO/IEC 42001:2023"
    clause_or_section: "Clause 8.4"
    citation_title: "Explainability of AI system decisions"
    mapping_status: "verified"
    notes: "Mandates provision of meaningful explanations to users affected by AI system outputs."

owner_placeholder: "[ROLE: Enterprise Explainability & Model Risk Lead]"
review_date_placeholder: "[YYYY-MM-DD]"
version: "1.0.0"
status: "DRAFT"
