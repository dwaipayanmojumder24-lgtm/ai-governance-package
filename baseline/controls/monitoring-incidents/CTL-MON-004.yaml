id: "ORG-CTL-MON-004"
title: "Standardized AI Incident Triage, Circuit Breaking, and RCA Reporting"
objective: "Implement automated circuit breakers to suspend compromised model traffic and mandate standardized incident classification, escalation, and Root Cause Analysis (RCA) reporting for safety, security, or legal AI breaches."
domain: "monitoring_drift_incidents"
type: "universal"

applicability_condition:
  predicate_type: "always"
  description: "Universal control applying to all production AI applications and infrastructure."

lifecycle_stages:
  - "deployment_admission"
  - "runtime_operation"
  - "incident_response"

enforcement_points:
  - "deployment_admission_controller"
  - "api_gateway_sidecar"
  - "manual_audit_gate"

check_type: "hybrid"
mode: "blocking"

evidence_required:
  - artifact_type: "ai_incident_report_and_rca"
    description: "Completed AI Incident Report conforming to templates/incident-report.md detailing incident root cause, blast radius, containment steps, and model fixes."
    format: "markdown"
    retention_period_years: 7

exception_eligibility:
  eligible: false
  statutory_prohibition: true
  minimum_compensating_controls:
    - "No exceptions permitted. Incident reporting and containment represent non-derogable security and legal duties."

reference_mappings:
  - framework: "EU AI Act Regulation (EU) 2024/1689"
    clause_or_section: "Article 73"
    citation_title: "Reporting of serious incidents"
    mapping_status: "verified"
    notes: "Mandates reporting of serious incidents involving high-risk AI systems to market authorities."
  - framework: "ISO/IEC 42001:2023"
    clause_or_section: "Clause 10.1"
    citation_title: "Nonconformity and corrective action"
    mapping_status: "verified"
    notes: "Requires formal corrective action and incident handling procedures."
  - framework: "NIST AI RMF 1.0"
    clause_or_section: "MANAGE 4.1"
    citation_title: "Incident response plans are established and maintained for AI systems."
    mapping_status: "verified"
    notes: "Requires formal response and escalation workflows for AI anomalies."

owner_placeholder: "[ROLE: Enterprise AI Incident Commander & SOC Lead]"
review_date_placeholder: "[YYYY-MM-DD]"
version: "1.0.0"
status: "DRAFT"
