id: "ORG-CTL-FAI-003"
title: "Universal Web and Digital Accessibility Conformance (WCAG 2.1 AA)"
objective: "Verify that all user-facing conversational AI interfaces, chatbot wrappers, and automated decision portals strictly conform to W3C Web Content Accessibility Guidelines (WCAG) 2.1 Level AA."
domain: "fairness_bias_accessibility"
type: "universal"

applicability_condition:
  predicate_type: "always"
  description: "Universal control applying to all user-facing digital interfaces delivering AI capabilities."

lifecycle_stages:
  - "integration_ci_cd"
  - "deployment_admission"

enforcement_points:
  - "pull_request_check"
  - "ci_build_pipeline"
  - "deployment_admission_controller"

check_type: "automated"
mode: "blocking"

evidence_required:
  - artifact_type: "wcag_accessibility_scan_report"
    description: "Automated accessibility scanner report (e.g. axe-core, Pa11y) confirming zero Level A or Level AA accessibility violations across all AI interaction views."
    format: "sarif_json"
    retention_period_years: 5

exception_eligibility:
  eligible: true
  statutory_prohibition: false
  minimum_compensating_controls:
    - "Dedicated accessible alternative telephone or human-supported channel provided with equal SLA."

reference_mappings:
  - framework: "W3C Web Content Accessibility Guidelines (WCAG) 2.1"
    clause_or_section: "Conformance Level AA"
    citation_title: "Web Content Accessibility Guidelines (WCAG) 2.1"
    mapping_status: "verified"
    notes: "Authoritative global standard for digital interface accessibility."
  - framework: "ISO/IEC 42001:2023"
    clause_or_section: "Annex A.5.3"
    citation_title: "Accessibility and inclusivity of AI systems"
    mapping_status: "verified"
    notes: "Requires AI interfaces to be accessible to persons with diverse abilities."
  - framework: "NIST AI RMF 1.0"
    clause_or_section: "GOVERN 1.2"
    citation_title: "Legal and accessibility standards are integrated into AI governance."
    mapping_status: "verified"
    notes: "Requires technical alignment with digital accessibility mandates."

owner_placeholder: "[ROLE: Enterprise Digital Accessibility Lead]"
review_date_placeholder: "[YYYY-MM-DD]"
version: "1.0.0"
status: "DRAFT"
