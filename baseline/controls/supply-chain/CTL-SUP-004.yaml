id: "ORG-CTL-SUP-004"
title: "Upstream AI Dependency Vulnerability and Package Tamper Scanning"
objective: "Enforce automated Software Composition Analysis (SCA) to block deployment of AI systems containing known critical vulnerabilities (CVEs) or compromised upstream machine learning dependencies."
domain: "supply_chain_third_party"
type: "parameterized"

applicability_condition:
  predicate_type: "always"
  description: "Universal control applying to all AI application repositories and runtime containers."

parameters:
  max_critical_cve_count:
    description: "Maximum allowable unmitigated Critical severity CVEs in runtime dependencies."
    data_type: "integer"
    default_value: 0
    allowed_range:
      min: 0
      max: 0
    monotonicity: "exact_match_only"
    approval_authority_placeholder: "[ROLE: Enterprise CISO]"
  max_high_cve_remediation_days:
    description: "Maximum calendar days allowed to remediate High severity CVEs before automated deployment freeze."
    data_type: "integer"
    default_value: 14
    allowed_range:
      min: 3
      max: 30
    monotonicity: "lower_is_stricter"
    approval_authority_placeholder: "[ROLE: Head of Application Security]"

lifecycle_stages:
  - "integration_ci_cd"
  - "deployment_admission"

enforcement_points:
  - "pull_request_check"
  - "ci_build_pipeline"
  - "deployment_admission_controller"

check_type: "automated"
mode: "blocking"

evidence_required:
  - artifact_type: "sca_vulnerability_scan_report"
    description: "SARIF or JSON vulnerability report generated by automated dependency scanner confirming zero unexempted Critical/High CVEs."
    format: "sarif_json"
    retention_period_years: 5

exception_eligibility:
  eligible: true
  statutory_prohibition: false
  minimum_compensating_controls:
    - "Documented compensating network control (e.g. WAF rule or blocked egress) signed by AppSec Lead."

reference_mappings:
  - framework: "OWASP Top 10 for LLM Applications (2025)"
    clause_or_section: "LLM03:2025"
    citation_title: "Supply Chain Risks - Upstream Vulnerabilities"
    mapping_status: "verified"
    notes: "Requires active SCA scanning to detect vulnerable third-party dependencies in AI stacks."
  - framework: "NIST AI RMF 1.0"
    clause_or_section: "PROTECT 1.1"
    citation_title: "Security vulnerabilities in AI software supply chain are managed."
    mapping_status: "verified"
    notes: "Mandates proactive vulnerability tracking across all system components."
  - framework: "ISO/IEC 42001:2023"
    clause_or_section: "Annex A.8.1"
    citation_title: "Vulnerability management in AI software"
    mapping_status: "verified"
    notes: "Requires regular scanning and timely remediation of software vulnerabilities."

owner_placeholder: "[ROLE: Enterprise Vulnerability Management Lead]"
review_date_placeholder: "[YYYY-MM-DD]"
version: "1.0.0"
status: "DRAFT"
