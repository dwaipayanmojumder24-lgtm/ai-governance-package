id: "ORG-CTL-IPR-002"
title: "Mandatory Human Peer Review of AI-Generated Software Code"
objective: "Ensure that all software source code, configuration files, and infrastructure scripts generated by AI coding assistants or autonomous coding agents undergo rigorous human peer review by an accountable software engineer before merging."
domain: "intellectual_property_licensing"
type: "conditional"

applicability_condition:
  predicate_type: "manifest_property_match"
  manifest_path: "ai_system_profile.declared_characteristics.generates_code_or_executable_artifacts"
  operator: "is_true"
  target_value: true
  description: "Applies to any repository utilizing AI code generation tools or autonomous coding agents."

lifecycle_stages:
  - "integration_ci_cd"

enforcement_points:
  - "pull_request_check"
  - "ci_build_pipeline"

check_type: "hybrid"
mode: "blocking"

evidence_required:
  - artifact_type: "peer_review_attestation_record"
    description: "Pull request metadata demonstrating at least one qualified human peer review approval by a non-author engineer prior to merge."
    format: "json"
    retention_period_years: 5

exception_eligibility:
  eligible: false
  statutory_prohibition: false
  minimum_compensating_controls:
    - "No exceptions permitted. Autonomous unreviewed commits to production codebases are strictly prohibited."

reference_mappings:
  - framework: "NIST AI RMF 1.0"
    clause_or_section: "GOVERN 1.2"
    citation_title: "Organizational practices ensure accountability for AI-generated outputs."
    mapping_status: "verified"
    notes: "Requires humans to maintain accountability for AI-assisted technical deliverables."
  - framework: "ISO/IEC 42001:2023"
    clause_or_section: "Clause 8.1"
    citation_title: "Operational control of AI development processes"
    mapping_status: "verified"
    notes: "Requires systematic peer review gates during AI software development."
  - framework: "OWASP Top 10 for LLM Applications (2025)"
    clause_or_section: "LLM05:2025"
    citation_title: "Improper Output Handling - Code Execution"
    mapping_status: "verified"
    notes: "Mandates human inspection of generated code to prevent accidental execution of flaws."

owner_placeholder: "[ROLE: Lead Software Engineering Architect]"
review_date_placeholder: "[YYYY-MM-DD]"
version: "1.0.0"
status: "DRAFT"
