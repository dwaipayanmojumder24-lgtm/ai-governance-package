id: "ORG-CTL-CST-002"
title: "Per-User and Per-Client Inference Rate Limiting"
objective: "Enforce token-bucket or leaky-bucket rate limiting across external and internal AI model endpoints to defend against automated query spam, bot abuse, and compute resource starvation."
domain: "cost_resource_limits"
type: "universal"

applicability_condition:
  predicate_type: "always"
  description: "Universal control applying to all deployed AI service endpoints and interactive gateways."

lifecycle_stages:
  - "deployment_admission"
  - "runtime_operation"

enforcement_points:
  - "deployment_admission_controller"
  - "api_gateway_sidecar"

check_type: "automated"
mode: "blocking"

evidence_required:
  - artifact_type: "rate_limiting_conformance_audit"
    description: "Automated test report verifying that burst traffic exceeding per-user RPM/TPM quotas returns HTTP 429 Too Many Requests."
    format: "json"
    retention_period_years: 3

exception_eligibility:
  eligible: true
  statutory_prohibition: false
  minimum_compensating_controls:
    - "Dedicated isolated compute pool with private API key for approved high-volume batch jobs."

reference_mappings:
  - framework: "OWASP Top 10 for LLM Applications (2025)"
    clause_or_section: "LLM04:2025"
    citation_title: "Model Denial of Service - Rate Limiting"
    mapping_status: "verified"
    notes: "Mandates rate limiting on requests and tokens to prevent denial-of-service."
  - framework: "NIST AI RMF 1.0"
    clause_or_section: "PROTECT 1.1"
    citation_title: "Cybersecurity controls manage resource availability and denial of service."
    mapping_status: "verified"
    notes: "Requires technical controls ensuring AI service availability."
  - framework: "ISO/IEC 42001:2023"
    clause_or_section: "Annex A.8.1"
    citation_title: "Security and availability controls for AI processing"
    mapping_status: "verified"
    notes: "Mandates protection against compute availability degradation."

owner_placeholder: "[ROLE: API Gateway & Platform Operations Lead]"
review_date_placeholder: "[YYYY-MM-DD]"
version: "1.0.0"
status: "DRAFT"
