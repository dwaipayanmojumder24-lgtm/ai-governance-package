id: "ORG-CTL-ROB-001"
title: "Mandatory Automated Domain Evaluation Harness and Test Suite"
objective: "Ensure that every model, RAG system, or autonomous agent maintains an automated evaluation harness and representative domain ground-truth benchmark suite executed during CI/CD to measure system accuracy and stability."
domain: "robustness_evaluation_testing"
type: "universal"

applicability_condition:
  predicate_type: "always"
  description: "Universal control applying to all AI models, predictive algorithms, and generative pipelines."

lifecycle_stages:
  - "data_preparation"
  - "model_training"
  - "evaluation_validation"
  - "integration_ci_cd"

enforcement_points:
  - "ci_build_pipeline"
  - "model_registry_admission"
  - "deployment_admission_controller"

check_type: "automated"
mode: "blocking"

evidence_required:
  - artifact_type: "evaluation_harness_test_suite"
    description: "Machine-readable test execution report detailing dataset version, test case count, evaluation metrics, and error classifications."
    format: "json"
    retention_period_years: 7

exception_eligibility:
  eligible: false
  statutory_prohibition: false
  minimum_compensating_controls:
    - "No exceptions permitted. Systems without an automated evaluation harness cannot be admitted to production."

reference_mappings:
  - framework: "NIST AI RMF 1.0"
    clause_or_section: "MEASURE 1.1"
    citation_title: "Approaches and metrics for measurement and monitoring of AI risks and trustworthiness are developed and documented."
    mapping_status: "verified"
    notes: "Requires formal measurement approaches and automated test environments."
  - framework: "ISO/IEC 42001:2023"
    clause_or_section: "Clause 9.1"
    citation_title: "Monitoring, measurement, analysis and evaluation"
    mapping_status: "verified"
    notes: "Mandates continuous quantitative evaluation against predefined quality metrics."
  - framework: "EU AI Act Regulation (EU) 2024/1689"
    clause_or_section: "Article 15(1)"
    citation_title: "Accuracy, robustness and cybersecurity of high-risk AI systems"
    mapping_status: "verified"
    notes: "Statutory requirement that AI systems achieve appropriate levels of performance and accuracy."

owner_placeholder: "[ROLE: Head of AI Evaluation & Testing]"
review_date_placeholder: "[YYYY-MM-DD]"
version: "1.0.0"
status: "DRAFT"
