id: "ORG-CTL-RSK-002"
title: "Pre-Deployment Algorithmic Impact Assessment (AIIA)"
objective: "Require all Moderate Risk (Tier 2) and High Risk (Tier 3) AI systems to complete and approve an Algorithmic Impact Assessment evaluating safety, bias, fundamental rights, and operational hazards before production release."
domain: "risk_classification_impact"
type: "conditional"

applicability_condition:
  predicate_type: "manifest_property_match"
  manifest_path: "ai_system_profile.risk_tier"
  operator: "in"
  target_value:
    - "tier_2_moderate"
    - "tier_3_high"
  description: "Applies to any system classified as Tier 2 (Moderate Risk) or Tier 3 (High Risk)."

lifecycle_stages:
  - "concept_design"
  - "evaluation_validation"
  - "deployment_admission"

enforcement_points:
  - "ci_build_pipeline"
  - "deployment_admission_controller"
  - "manual_audit_gate"

check_type: "hybrid"
mode: "blocking"

evidence_required:
  - artifact_type: "approved_aiia_dossier"
    description: "Completed AI Impact Assessment conforming to templates/ai-impact-assessment.md with signed approval from Risk Officer and Review Board."
    format: "markdown"
    retention_period_years: 7

exception_eligibility:
  eligible: false
  statutory_prohibition: true
  minimum_compensating_controls:
    - "No exceptions permitted for production deployments. Staging pilots may proceed only with sandbox isolation."

reference_mappings:
  - framework: "NIST AI RMF 1.0"
    clause_or_section: "MAP 2.1"
    citation_title: "Organizational risk tolerances are determined and documented."
    mapping_status: "verified"
    notes: "AIIA operationalizes risk tolerance evaluation and residual risk documentation."
  - framework: "EU AI Act Regulation (EU) 2024/1689"
    clause_or_section: "Article 27"
    citation_title: "Fundamental rights impact assessment for high-risk AI systems"
    mapping_status: "verified"
    notes: "Direct statutory basis requiring assessment of impact on fundamental rights prior to high-risk deployment."
  - framework: "ISO/IEC 42001:2023"
    clause_or_section: "Annex A.4"
    citation_title: "AI impact assessment"
    mapping_status: "verified"
    notes: "Mandates documented impact assessments across ethical and social dimensions."

owner_placeholder: "[ROLE: Enterprise AI Risk Officer]"
review_date_placeholder: "[YYYY-MM-DD]"
version: "1.0.0"
status: "DRAFT"
