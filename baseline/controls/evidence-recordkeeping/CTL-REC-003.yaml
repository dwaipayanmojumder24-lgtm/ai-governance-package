id: "ORG-CTL-REC-003"
title: "Digital Signing and Attestation of Production Deployment Bundles"
objective: "Cryptographically sign container images, model weights, and evidence bundles using enterprise code-signing identities (e.g. Cosign, Sigstore, KMS) before admission to production clusters, enforcing non-repudiation."
domain: "evidence_integrity_recordkeeping"
type: "conditional"

applicability_condition:
  predicate_type: "manifest_property_match"
  manifest_path: "ai_system_profile.risk_tier"
  operator: "in"
  target_value:
    - "tier_2_moderate"
    - "tier_3_high"
  description: "Applies to Moderate Risk and High Risk production release artifacts."

lifecycle_stages:
  - "deployment_admission"

enforcement_points:
  - "ci_build_pipeline"
  - "deployment_admission_controller"

check_type: "automated"
mode: "blocking"

evidence_required:
  - artifact_type: "cryptographic_signature_attestation"
    description: "Cosign / Sigstore signed bundle verification output confirming container digest, manifest, and evidence records match enterprise signing keys."
    format: "json"
    retention_period_years: 7

exception_eligibility:
  eligible: true
  statutory_prohibition: false
  minimum_compensating_controls:
    - "Manual out-of-band release token generated by CISO delegate for emergency zero-day patch."

reference_mappings:
  - framework: "NIST AI RMF 1.0"
    clause_or_section: "PROTECT 1.1"
    citation_title: "Cryptographic mechanisms protect AI deployment pipelines and artifacts."
    mapping_status: "verified"
    notes: "Requires code signing and non-repudiation across AI release pipelines."
  - framework: "ISO/IEC 42001:2023"
    clause_or_section: "Annex A.8.1"
    citation_title: "Integrity and authentication of deployed AI components"
    mapping_status: "verified"
    notes: "Mandates technical authentication verifying that deployed assets originate from trusted build pipelines."

owner_placeholder: "[ROLE: Enterprise DevSecOps & Release Engineering Lead]"
review_date_placeholder: "[YYYY-MM-DD]"
version: "1.0.0"
status: "DRAFT"
