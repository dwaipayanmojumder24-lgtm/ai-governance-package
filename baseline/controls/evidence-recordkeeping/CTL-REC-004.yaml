id: "ORG-CTL-REC-004"
title: "Commit-Level Traceability and Evidentiary Retention Schedule"
objective: "Enforce complete bidirectional traceability from production container digests back to source Git commits and mandate automated archival retention schedules for all governance evidence records."
domain: "evidence_integrity_recordkeeping"
type: "parameterized"

applicability_condition:
  predicate_type: "always"
  description: "Universal control applying to all evidence bundles across all risk tiers."

parameters:
  high_risk_retention_years:
    description: "Mandatory retention period in years for governance evidence records associated with Tier 3 High Risk systems."
    data_type: "integer"
    default_value: 7
    allowed_range:
      min: 5
      max: 15
    monotonicity: "higher_is_stricter"
    approval_authority_placeholder: "[ROLE: Enterprise General Counsel & Head of Compliance]"
  standard_retention_years:
    description: "Retention period in years for governance evidence records associated with Tier 1 and Tier 2 systems."
    data_type: "integer"
    default_value: 3
    allowed_range:
      min: 1
      max: 7
    monotonicity: "higher_is_stricter"
    approval_authority_placeholder: "[ROLE: Head of Internal Audit]"

lifecycle_stages:
  - "deployment_admission"
  - "runtime_operation"
  - "retirement_decommissioning"

enforcement_points:
  - "ci_build_pipeline"
  - "deployment_admission_controller"
  - "manual_audit_gate"

check_type: "automated"
mode: "blocking"

evidence_required:
  - artifact_type: "retention_schedule_enforcement_audit"
    description: "Automated scan output verifying compliance vault retention locks adhere to required year parameters based on manifest risk tier."
    format: "json"
    retention_period_years: 7

exception_eligibility:
  eligible: false
  statutory_prohibition: true
  minimum_compensating_controls:
    - "No exceptions permitted. Evidence retention schedules are bound by statutory regulatory and tax record laws."

reference_mappings:
  - framework: "EU AI Act Regulation (EU) 2024/1689"
    clause_or_section: "Article 18 / Article 26(5)"
    citation_title: "Obligation to keep documentation for deployers and providers of high-risk AI"
    mapping_status: "verified"
    notes: "Requires maintaining documentation and logs for periods specified under Union law (typically 10 years for providers, 6 months to 7 years for deployers)."
  - framework: "ISO/IEC 42001:2023"
    clause_or_section: "Clause 7.5.3"
    citation_title: "Retention and disposition of documented information"
    mapping_status: "verified"
    notes: "Mandates defined retention schedules for AI management system documentation."
  - framework: "NIST AI RMF 1.0"
    clause_or_section: "GOVERN 1.2"
    citation_title: "Document retention and auditability over the AI lifecycle"
    mapping_status: "verified"
    notes: "Requires preservation of risk management documentation for post-deployment audit."

owner_placeholder: "[ROLE: Head of AI Compliance & Internal Audit Lead]"
review_date_placeholder: "[YYYY-MM-DD]"
version: "1.0.0"
status: "DRAFT"
