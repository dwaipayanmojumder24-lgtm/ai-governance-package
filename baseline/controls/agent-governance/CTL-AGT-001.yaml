id: "ORG-CTL-AGT-001"
title: "Outside-the-Model Policy Enforcement and Authorization Boundary"
objective: "Guarantee that all agent tool invocations, database writes, and external API requests are evaluated and authorized strictly by an external Policy Enforcement Point (PEP) outside the model, rejecting model self-authorization claims."
domain: "agent_autonomy_guardrails"
type: "conditional"

applicability_condition:
  predicate_type: "manifest_property_match"
  manifest_path: "ai_system_profile.declared_characteristics.executes_tools_or_code"
  operator: "is_true"
  target_value: true
  description: "Applies to any AI system where a model plans, formats, or dispatches automated tool calls or code execution."

lifecycle_stages:
  - "integration_ci_cd"
  - "deployment_admission"
  - "runtime_operation"

enforcement_points:
  - "ci_build_pipeline"
  - "deployment_admission_controller"
  - "agent_runtime_interceptor"

check_type: "automated"
mode: "blocking"

evidence_required:
  - artifact_type: "outside_the_model_pep_conformance_report"
    description: "Automated architectural verification proving that agent runtime executes behind an external PEP and that tool endpoints refuse unmediated direct model calls."
    format: "json"
    retention_period_years: 7

exception_eligibility:
  eligible: false
  statutory_prohibition: false
  minimum_compensating_controls:
    - "No exceptions permitted. Relying on an LLM to self-authorize tool execution is an architecturally invalid safety pattern."

reference_mappings:
  - framework: "OWASP Top 10 for LLM Applications (2025)"
    clause_or_section: "LLM06:2025"
    citation_title: "Excessive Agency - Outside-the-Model Controls"
    mapping_status: "verified"
    notes: "Direct mandate requiring permissions to be checked outside the model before executing actions."
  - framework: "NIST AI 600-1 (GenAI Profile)"
    clause_or_section: "MANAGE 2.1"
    citation_title: "Boundaries and fail-safe controls for autonomous agent actions"
    mapping_status: "verified"
    notes: "Requires external boundary controls governing agentic execution environments."
  - framework: "ISO/IEC 42001:2023"
    clause_or_section: "Annex A.8.4"
    citation_title: "Control of autonomous actions and operational boundaries"
    mapping_status: "verified"
    notes: "Mandates technical mechanisms to bound and authorize automated actions."

owner_placeholder: "[ROLE: Principal Agent Architect]"
review_date_placeholder: "[YYYY-MM-DD]"
version: "1.0.0"
status: "DRAFT"
