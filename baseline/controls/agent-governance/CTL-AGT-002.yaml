id: "ORG-CTL-AGT-002"
title: "Dedicated Non-Human Machine Identity and Scoped Delegation"
objective: "Enforce dedicated, cryptographically verifiable non-human service identities (e.g. SPIFFE, OAuth2 service principal) for autonomous agents, prohibiting user impersonation and unconstrained transitive delegation."
domain: "agent_autonomy_guardrails"
type: "conditional"

applicability_condition:
  predicate_type: "manifest_property_match"
  manifest_path: "ai_system_profile.declared_characteristics.executes_tools_or_code"
  operator: "is_true"
  target_value: true
  description: "Applies to any agent executing tools or interacting with enterprise APIs."

lifecycle_stages:
  - "integration_ci_cd"
  - "deployment_admission"
  - "runtime_operation"

enforcement_points:
  - "ci_build_pipeline"
  - "deployment_admission_controller"
  - "agent_runtime_interceptor"

check_type: "automated"
mode: "blocking"

evidence_required:
  - artifact_type: "agent_iam_binding_attestation"
    description: "Cloud IAM / SPIFFE directory verification confirming agent possesses a scoped non-human service identity and dual-subject token constraints."
    format: "json"
    retention_period_years: 5

exception_eligibility:
  eligible: false
  statutory_prohibition: false
  minimum_compensating_controls:
    - "No exceptions permitted. Agents must never execute with unmonitored human credentials or generic shared accounts."

reference_mappings:
  - framework: "OWASP Top 10 for LLM Applications (2025)"
    clause_or_section: "LLM06:2025"
    citation_title: "Excessive Agency - Least Privilege Identity"
    mapping_status: "verified"
    notes: "Requires assigning least-privilege machine credentials to autonomous agents."
  - framework: "NIST AI RMF 1.0"
    clause_or_section: "PROTECT 1.1"
    citation_title: "Identity and access management controls protect AI systems."
    mapping_status: "verified"
    notes: "Integrates IAM principles of least privilege into AI service execution."
  - framework: "ISO/IEC 42001:2023"
    clause_or_section: "Annex A.8.2"
    citation_title: "Access control and authentication for AI components"
    mapping_status: "verified"
    notes: "Requires strict non-human identity management for automated AI subsystems."

owner_placeholder: "[ROLE: Enterprise IAM & Security Lead]"
review_date_placeholder: "[YYYY-MM-DD]"
version: "1.0.0"
status: "DRAFT"
